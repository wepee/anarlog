[package]
name = "db-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anlg-db-app = { workspace = true }
anlg-db-core = { workspace = true }
anlg-e2ee = { workspace = true }

futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "query", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
wiremock = { workspace = true }
