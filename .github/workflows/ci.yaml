on:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node scripts/check-macos-only.mjs
      - run: node scripts/sync-desktop-changelogs.mjs --check
      - run: node scripts/release-version.mjs --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - run: pnpm install --frozen-lockfile
      - run: >-
          node --test
          scripts/dev.test.mjs
          scripts/pr-description.test.mjs
          scripts/release-version.test.mjs
          scripts/notarize-dmg.test.mjs
          scripts/changelog-bundle.test.mjs
          scripts/changelog-baseline.test.mjs
          scripts/verify-release-candidate.test.mjs
          scripts/security-dependencies.test.mjs
          scripts/publish-anarlog-skill.test.mjs
